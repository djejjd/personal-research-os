name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Governance checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify whitespace
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: git diff --check origin/$BASE_REF...HEAD
      - name: Reject private documents
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: |
          if git diff --name-only origin/$BASE_REF...HEAD | grep -Eq '^(docs/|scripts/docs/)'; then
            echo 'docs/ and scripts/docs/ contain local private design records and cannot be submitted.' >&2
            exit 1
          fi

  build-and-test:
    name: Build and test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require a check entrypoint for CMake projects
        if: ${{ hashFiles('CMakeLists.txt') != '' && hashFiles('scripts/check.sh') == '' }}
        run: |
          echo 'CMake projects must provide scripts/check.sh.' >&2
          exit 1
      - name: Install development build dependencies
        if: ${{ hashFiles('CMakeLists.txt') != '' }}
        run: brew bundle install --file Brewfile --no-upgrade
      # S5 发布工作流改为先固定 toolchain.lock.sh 中的 brew/core revision，
      # 再执行 scripts/release/check-toolchain-lock.sh；开发 PR 不使用该严格锁定。
      - name: Run local check entrypoint
        if: ${{ hashFiles('scripts/check.sh') != '' }}
        run: scripts/check.sh
