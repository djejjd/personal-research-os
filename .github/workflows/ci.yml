name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  governance:
    name: Governance checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Verify whitespace
        run: git diff --check origin/${{ github.base_ref }}...HEAD
      - name: Reject private documents
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -Eq '^(docs/|scripts/docs/)'; then
            echo 'docs/ and scripts/docs/ contain local private design records and cannot be submitted.' >&2
            exit 1
          fi

  build-and-test:
    name: Build and test
    runs-on: macos-14
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_FROM_API: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Require a check entrypoint for CMake projects
        if: ${{ hashFiles('CMakeLists.txt') != '' && hashFiles('scripts/check.sh') == '' }}
        run: |
          echo 'CMake projects must provide scripts/check.sh.' >&2
          exit 1
      - name: Pin Homebrew core revision
        if: ${{ hashFiles('CMakeLists.txt') != '' }}
        run: |
          . ./toolchain.lock.sh
          brew tap --force homebrew/core https://github.com/Homebrew/homebrew-core
          core_repository="$(brew --repo homebrew/core)"
          git -C "$core_repository" fetch --depth=1 origin "$PROS_HOMEBREW_CORE_REVISION"
          git -C "$core_repository" checkout --detach "$PROS_HOMEBREW_CORE_REVISION"
          test "$(git -C "$core_repository" rev-parse HEAD)" = "$PROS_HOMEBREW_CORE_REVISION"
      - name: Install locked build and static-analysis dependencies
        if: ${{ hashFiles('CMakeLists.txt') != '' }}
        run: brew bundle install --file Brewfile --no-upgrade
      - name: Run local check entrypoint
        if: ${{ hashFiles('scripts/check.sh') != '' }}
        run: scripts/check.sh
